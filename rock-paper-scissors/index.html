<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Rock Paper Scissors</h1>
    <p class="instruction">Choose your move!</p>
    <div class="choices">
        <button class="choice" id="rock">✊</button>
        <button class="choice" id="paper">✋</button>
        <button class="choice" id="scissors">✌️</button>
    </div>
    <div class="result">
        <p>You: <span id="user-choice">-</span></p>
        <p>Computer: <span id="computer-choice">-</span></p>
        <h2 id="winner">Let's Play!</h2>
    </div>
    <div class="score">
        <p>You: <span id="user-score">0</span></p>
        <p>Computer: <span id="computer-score">0</span></p>
    </div>
    <button id="reset">Reset Game</button>
    <a href="../index.html" class="home-btn">🏠 Home</a>
</div>

<script src="script.js"></script>

</body>
</html>
